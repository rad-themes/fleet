<section class="shell section-space">{{ partial:partials/section-title }}<div class="grid gap-x-6 gap-y-12 md:grid-cols-3">
{{ collection:services :limit="limit" sort="title:asc" }}<a class="group block" href="{{ url }}"><div class="relative overflow-hidden bg-mist">{{ if image }}<img class="aspect-[4/5] w-full object-cover transition-transform duration-500 motion-safe:group-hover:scale-105" src="{{ image:url }}" alt="{{ image_alt | sanitize }}" loading="lazy">{{ else }}<div class="flex aspect-[4/5] items-center justify-center text-6xl" aria-hidden="true">↗</div>{{ /if }}<span class="absolute bottom-5 right-5 flex size-11 items-center justify-center bg-paper text-xl" aria-hidden="true">↗</span><span class="absolute left-5 top-5 bg-paper px-3 py-1.5 font-mono text-xs">{{ label | sanitize }}</span></div><div class="mt-5 flex items-start justify-between gap-4"><h3 class="text-2xl tracking-tight">{{ title | sanitize }}</h3><span class="font-mono text-xs text-muted">0{{ count }}</span></div><p class="mt-3 max-w-sm text-muted">{{ summary | sanitize }}</p></a>{{ /collection:services }}
</div></section>
