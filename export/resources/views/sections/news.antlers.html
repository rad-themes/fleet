<section class="shell section-space">{{ partial:partials/section-title }}<div class="grid gap-8 md:grid-cols-3">
{{ collection:news :limit="limit" sort="title:asc" }}<article><a class="group block" href="{{ url }}">{{ if image }}<div class="overflow-hidden"><img class="aspect-[3/2] w-full object-cover transition-transform duration-500 motion-safe:group-hover:scale-105" src="{{ image:url }}" alt="{{ image_alt | sanitize }}" loading="lazy"></div>{{ /if }}<p class="eyebrow mb-4 mt-6 text-muted">{{ label | sanitize }}</p><h3 class="max-w-sm text-2xl leading-snug tracking-tight group-hover:underline">{{ title | sanitize }}</h3><p class="mt-4 text-muted">{{ summary | sanitize }}</p><span class="text-link mt-6">Read story <span aria-hidden="true">↗</span></span></a></article>{{ /collection:news }}
</div></section>
