<section class="{{ if dark }}bg-ink text-paper{{ else }}bg-mist{{ /if }}"><div class="shell grid gap-10 py-16 md:grid-cols-2 md:items-center md:gap-16 md:py-24"><div><p class="eyebrow mb-10 {{ if dark }}text-white/55{{ /if }}">{{ eyebrow | sanitize }}</p><h2 class="display-heading whitespace-pre-line">{{ heading | sanitize }}</h2>{{ if description }}<p class="mt-7 max-w-lg leading-relaxed {{ if dark }}text-white/65{{ else }}text-muted{{ /if }}">{{ description | sanitize }}</p>{{ /if }}{{ if link && link_label }}<a class="text-link mt-9" href="{{ link }}">{{ link_label | sanitize }}<span aria-hidden="true">↗</span></a>{{ /if }}</div>{{ if image }}<img class="aspect-[5/4] w-full object-cover" src="{{ image:url }}" alt="{{ image_alt | sanitize }}" loading="lazy">{{ /if }}</div></section>
